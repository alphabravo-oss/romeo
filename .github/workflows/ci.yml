name: Romeo CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: romeo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  CI: "true"

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact=100 --no-banner --exit-code 1 /repo

      - name: Semgrep SAST
        run: >-
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep@sha256:9fb6f44dc162b1e0aada85f072a95141844c61e3bfcedf40b8a46fecf208e986
          semgrep scan --config .semgrep.yml --error
          --exclude node_modules --exclude dist --exclude .output .

      - name: Scan repository filesystem
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --skip-dirs .git /repo

      - name: Build images
        run: |
          docker build --target app-runtime --tag romeo:ci-app --file deploy/compose/Dockerfile .
          docker build --target ops-runtime --tag romeo:ci-ops --file deploy/compose/Dockerfile .

      - name: Scan images
        run: |
          for image in romeo:ci-app romeo:ci-ops; do
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
              image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Static checks
        run: |
          pnpm check:source-suppressions
          pnpm check:architecture
          pnpm check:dependencies
          pnpm check:dead-code
          pnpm check:dns-pinning-parity
          pnpm check:version-consistency
      - name: API contract
        run: |
          pnpm contract:lint
          pnpm contract:breaking
          pnpm check:public-api-errors
          pnpm check:openapi-route-coverage
          pnpm check:sdk-typescript-drift
          pnpm check:sdk-drift
      - name: Migration ledger
        run: pnpm check:database-evolution-policy
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Generated route tree is committed
        run: git diff --exit-code -- apps/app/src/routeTree.gen.ts
      - name: Bundle budget
        run: pnpm check:bundle-budget

  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: romeo
          POSTGRES_USER: romeo
          POSTGRES_PASSWORD: romeo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romeo -d romeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://romeo:romeo@localhost:5432/romeo
      ROMEO_POSTGRES_CONFORMANCE_DATABASE_URL: postgres://romeo:romeo@localhost:5432/romeo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm migrate:postgres
      - name: Validate schema
        run: pnpm validate:postgres
      - name: Database tests against live Postgres
        run: pnpm test:postgres-conformance

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser acceptance
        run: pnpm quality:browser

  kubernetes:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      - run: pnpm install --frozen-lockfile
      - name: Render chart variants
        run: pnpm smoke:kubernetes:render
      - name: Production policy
        run: pnpm check:helm-production-policy

  compose-smoke:
    name: Compose Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, postgres]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            command: pnpm smoke:compose
          - name: auth
            command: pnpm smoke:compose:auth
          - name: external-postgres
            command: pnpm smoke:compose:external-postgres
          - name: workers
            command: pnpm smoke:compose:workers
          - name: backup-restore
            command: pnpm smoke:compose:backup-restore
          - name: secret-rotation
            command: pnpm smoke:compose:secret-rotation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run smoke
        run: ${{ matrix.command }}
