postgres:
  mode: external
  databaseUrlSecret:
    name: romeo-postgres
    key: DATABASE_URL

secrets:
  existingSecret: romeo-runtime

env:
  APP_ORIGIN: https://romeo.example.com
  OBJECT_STORE_DRIVER: s3
  S3_ENDPOINT: https://s3.example.com
  S3_BUCKET: romeo
  S3_REGION: us-east-1
  DEV_SEEDED_LOGIN: "false"

valkey:
  urlSecret:
    name: romeo-valkey
    key: VALKEY_URL

# Scheduled all-tenant operations run inside the app's fenced coordinator.
# External execution workers, when enabled, each require their own broker
# credential and Kubernetes service account under workers.<name>.identity.

backup:
  mode: managed-verified
  enabled: true
  uploadUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_UPLOAD_URL
  manifestUploadUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_MANIFEST_UPLOAD_URL
  readbackUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_READBACK_URL
  manifestReadbackUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_MANIFEST_READBACK_URL
  statusUploadUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_STATUS_UPLOAD_URL
  statusReadbackUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_STATUS_READBACK_URL
  policyReadbackUrlSecret:
    name: romeo-postgres-backup
    key: POSTGRES_BACKUP_POLICY_READBACK_URL
