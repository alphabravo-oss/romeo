postgres:
  mode: cloudnativepg
  cloudnativepg:
    clusterName: romeo-pg
    databaseUrlSecret:
      name: romeo-pg-app
      key: uri

secrets:
  existingSecret: romeo-runtime

env:
  APP_ORIGIN: https://romeo.example.com
  OBJECT_STORE_DRIVER: s3
  S3_ENDPOINT: https://s3.example.com
  S3_BUCKET: romeo
  S3_REGION: us-east-1
  DEV_SEEDED_LOGIN: "false"

valkey:
  urlSecret:
    name: romeo-valkey
    key: VALKEY_URL

# Scheduled all-tenant operations run inside the app's fenced coordinator.

backup:
  mode: externally-managed
  enabled: false
  externalManagement:
    owner: platform-database-team
    evidenceReference: cloudnativepg-scheduled-backup-and-restore-runbook
    observedAt: "2026-08-23T00:00:00Z"
    statusReference: cloudnativepg-live-backup-status-dashboard
    alertsConfigured: true
