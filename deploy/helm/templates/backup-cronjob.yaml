{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "romeo.fullname" . }}-postgres-backup
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "romeo.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: postgres-backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "romeo.identityServiceAccountName" (dict "root" . "identity" (dict "serviceAccount" .Values.backup.serviceAccount) "component" "postgres-backup") }}
          securityContext:
            {{- toYaml .Values.workers.podSecurityContext | nindent 12 }}
          containers:
            - name: postgres-backup
              image: {{ include "romeo.opsImage" . | quote }}
              imagePullPolicy: {{ include "romeo.opsPullPolicy" . }}
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -eu
                  pnpm backup:postgres -- \
                    --output /tmp/romeo-postgres.dump \
                    --manifest-output /tmp/romeo-postgres.dump.manifest.json \
                    --status-output /tmp/romeo-postgres.dump.status.json \
                    --durability-mode verified-upload \
                    --retention-days "${POSTGRES_BACKUP_RETENTION_DAYS:-30}" \
                    --policy-max-age-seconds "${POSTGRES_BACKUP_POLICY_MAX_AGE_SECONDS:-3600}" \
                    --upload-timeout-ms "${POSTGRES_BACKUP_UPLOAD_TIMEOUT_MS:-30000}"
              env:
                {{- include "romeo.nodeWritableEnv" . | nindent 16 }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "romeo.databaseUrlSecretName" . }}
                      key: {{ include "romeo.databaseUrlSecretKey" . }}
                - name: POSTGRES_BACKUP_RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: POSTGRES_BACKUP_UPLOAD_TIMEOUT_MS
                  value: {{ .Values.backup.uploadTimeoutMs | quote }}
                - name: POSTGRES_BACKUP_POLICY_MAX_AGE_SECONDS
                  value: {{ .Values.backup.policyMaxAgeSeconds | quote }}
                - name: POSTGRES_BACKUP_UPLOAD_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.uploadUrlSecret.name }}
                      key: {{ .Values.backup.uploadUrlSecret.key }}
                - name: POSTGRES_BACKUP_READBACK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.readbackUrlSecret.name }}
                      key: {{ .Values.backup.readbackUrlSecret.key }}
                - name: POSTGRES_BACKUP_MANIFEST_UPLOAD_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.manifestUploadUrlSecret.name }}
                      key: {{ .Values.backup.manifestUploadUrlSecret.key }}
                - name: POSTGRES_BACKUP_MANIFEST_READBACK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.manifestReadbackUrlSecret.name }}
                      key: {{ .Values.backup.manifestReadbackUrlSecret.key }}
                - name: POSTGRES_BACKUP_STATUS_UPLOAD_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.statusUploadUrlSecret.name }}
                      key: {{ .Values.backup.statusUploadUrlSecret.key }}
                - name: POSTGRES_BACKUP_STATUS_READBACK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.statusReadbackUrlSecret.name }}
                      key: {{ .Values.backup.statusReadbackUrlSecret.key }}
                - name: POSTGRES_BACKUP_POLICY_READBACK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.policyReadbackUrlSecret.name }}
                      key: {{ .Values.backup.policyReadbackUrlSecret.key }}
              securityContext:
                {{- toYaml .Values.workers.securityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
