{{- if .Values.evidenceMount.enabled }}
{{- if and .Values.evidenceMount.configMapName .Values.evidenceMount.secretName }}
{{- fail "evidenceMount supports exactly one of configMapName or secretName" }}
{{- end }}
{{- if not (or .Values.evidenceMount.configMapName .Values.evidenceMount.secretName) }}
{{- fail "evidenceMount.enabled requires configMapName or secretName" }}
{{- end }}
{{- end }}
{{- include "romeo.validateProduction" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "romeo.fullname" . }}
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "romeo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "romeo.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: {{ include "romeo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "romeo.configMapName" . }}
            {{- if or .Values.secrets.existingSecret .Values.secrets.create }}
            - secretRef:
                name: {{ include "romeo.secretName" . }}
            {{- end }}
          env:
            {{- include "romeo.nodeWritableEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "romeo.databaseUrlSecretName" . }}
                  key: {{ include "romeo.databaseUrlSecretKey" . }}
            {{- if .Values.valkey.urlSecret.name }}
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.urlSecret.name }}
                  key: {{ .Values.valkey.urlSecret.key }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if .Values.probes.readiness.dependencyCheck.enabled }}
            exec:
              command:
                - node
                - -e
                - |
                  const net = require("node:net");
                  const defaults = { "postgres:": 5432, "postgresql:": 5432, "redis:": 6379, "rediss:": 6379 };
                  const connect = (raw) => new Promise((resolve, reject) => {
                    const target = new URL(raw);
                    const socket = net.connect({ host: target.hostname, port: Number(target.port || defaults[target.protocol]) }, () => { socket.destroy(); resolve(); });
                    socket.setTimeout(1500, () => socket.destroy(new Error("timeout")));
                    socket.once("error", reject);
                  });
                  Promise.all([
                    fetch("http://127.0.0.1:{{ .Values.service.port }}/api/v1/health").then((response) => { if (!response.ok) throw new Error("unhealthy"); }),
                    connect(process.env.DATABASE_URL),
                    connect(process.env.VALKEY_URL),
                  ]).then(() => process.exit(0), () => process.exit(1));
            {{- else }}
            httpGet:
              path: /api/v1/health
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.evidenceMount.enabled }}
          volumeMounts:
            - name: {{ .Values.evidenceMount.name | quote }}
              mountPath: {{ .Values.evidenceMount.mountPath | quote }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- else }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.evidenceMount.enabled }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: {{ .Values.evidenceMount.name | quote }}
          {{- if .Values.evidenceMount.configMapName }}
          configMap:
            name: {{ .Values.evidenceMount.configMapName | quote }}
          {{- else }}
          secret:
            secretName: {{ .Values.evidenceMount.secretName | quote }}
          {{- end }}
      {{- end }}
      {{- if not .Values.evidenceMount.enabled }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
