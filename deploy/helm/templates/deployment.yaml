{{- include "romeo.validateProduction" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "romeo.fullname" . }}
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "romeo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "romeo.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: {{ include "romeo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "romeo.configMapName" . }}
            {{- if or .Values.secrets.existingSecret .Values.secrets.create }}
            - secretRef:
                name: {{ include "romeo.secretName" . }}
            {{- end }}
          env:
            {{- include "romeo.nodeWritableEnv" . | nindent 12 }}
            - name: TOOL_DISPATCH_WORKER_ENABLED
              value: {{ .Values.workers.toolDispatch.enabled | quote }}
            - name: BROWSER_AUTOMATION_WORKER_ENABLED
              value: {{ .Values.workers.browserAutomation.enabled | quote }}
            - name: KNOWLEDGE_EXTRACTION_WORKER_ENABLED
              value: {{ .Values.workers.knowledgeExtraction.enabled | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "romeo.databaseUrlSecretName" . }}
                  key: {{ include "romeo.databaseUrlSecretKey" . }}
            {{- if .Values.valkey.urlSecret.name }}
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.urlSecret.name }}
                  key: {{ .Values.valkey.urlSecret.key }}
            {{- end }}
            {{- $brokerIdentities := list
              (dict "enabled" .Values.workers.toolDispatch.enabled "currentEnv" "TOOL_DISPATCH_BROKER_TOKEN" "previousEnv" "TOOL_DISPATCH_BROKER_TOKEN_PREVIOUS" "identity" .Values.workers.toolDispatch.identity)
              (dict "enabled" .Values.workers.browserAutomation.enabled "currentEnv" "BROWSER_AUTOMATION_BROKER_TOKEN" "previousEnv" "BROWSER_AUTOMATION_BROKER_TOKEN_PREVIOUS" "identity" .Values.workers.browserAutomation.identity)
              (dict "enabled" .Values.workers.knowledgeExtraction.enabled "currentEnv" "KNOWLEDGE_EXTRACTION_BROKER_TOKEN" "previousEnv" "KNOWLEDGE_EXTRACTION_BROKER_TOKEN_PREVIOUS" "identity" .Values.workers.knowledgeExtraction.identity)
            -}}
            {{- range $broker := $brokerIdentities }}
            {{- if $broker.enabled }}
            - name: {{ $broker.currentEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ $broker.identity.credentialSecret.name | quote }}
                  key: {{ $broker.identity.credentialSecret.key | quote }}
            {{- if $broker.identity.previousCredentialSecret.name }}
            - name: {{ $broker.previousEnv }}
              valueFrom:
                secretKeyRef:
                  name: {{ $broker.identity.previousCredentialSecret.name | quote }}
                  key: {{ $broker.identity.previousCredentialSecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.essentialOperations.scheduledTenantWork.mode "external" }}
            - name: SCHEDULED_TENANT_WORK_EXTERNAL_EVIDENCE_PATH
              value: /var/run/romeo/scheduled-operations/{{ .Values.essentialOperations.scheduledTenantWork.externalManagement.evidenceConfigMap.key }}
            - name: SCHEDULED_TENANT_WORK_EXTERNAL_EVIDENCE_MAX_AGE_SECONDS
              value: {{ .Values.essentialOperations.scheduledTenantWork.maxEvidenceAgeSeconds | quote }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if .Values.probes.readiness.dependencyCheck.enabled }}
            exec:
              command:
                - node
                - -e
                - 'fetch("http://127.0.0.1:{{ .Values.service.port }}/api/v1/readyz").then((response) => process.exit(response.status === 200 ? 0 : 1), () => process.exit(1))'
            {{- else }}
            httpGet:
              path: /api/v1/health
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.essentialOperations.scheduledTenantWork.mode "external" }}
            - name: scheduled-operation-evidence
              mountPath: /var/run/romeo/scheduled-operations
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.essentialOperations.scheduledTenantWork.mode "external" }}
        - name: scheduled-operation-evidence
          configMap:
            name: {{ .Values.essentialOperations.scheduledTenantWork.externalManagement.evidenceConfigMap.name | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
