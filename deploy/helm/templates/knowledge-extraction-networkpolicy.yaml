{{- if and .Values.workers.knowledgeExtraction.enabled .Values.workers.knowledgeExtraction.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "romeo.fullname" . }}-knowledge-extraction
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-extraction
spec:
  podSelector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: knowledge-extraction
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "romeo.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- with .Values.workers.knowledgeExtraction.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
