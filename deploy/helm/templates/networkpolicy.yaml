{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "romeo.fullname" . }}-default-deny
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "romeo.fullname" . }}-app
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- else }}
        # Empty ingressFrom permits only callers in this namespace, rather than
        # silently opening the application to every namespace in the cluster.
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if or .Values.workers.toolDispatch.enabled .Values.workers.browserAutomation.enabled .Values.workers.knowledgeExtraction.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "romeo.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  {{- if .Values.workers.toolDispatch.enabled }}
                  - tool-dispatch
                  {{- end }}
                  {{- if .Values.workers.browserAutomation.enabled }}
                  - browser-automation
                  {{- end }}
                  {{- if .Values.workers.knowledgeExtraction.enabled }}
                  - knowledge-extraction
                  {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    []
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "romeo.fullname" . }}-operations
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "romeo.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - app
          - tool-dispatch
          - browser-automation
          - knowledge-extraction
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    []
    {{- end }}
{{- end }}
