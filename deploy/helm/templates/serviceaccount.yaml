{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "romeo.serviceAccountName" . }}
  labels:
    {{- include "romeo.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- $workloads := list
  (dict "enabled" .Values.workers.toolDispatch.enabled "component" "tool-dispatch" "identity" .Values.workers.toolDispatch.identity)
  (dict "enabled" .Values.workers.browserAutomation.enabled "component" "browser-automation" "identity" .Values.workers.browserAutomation.identity)
  (dict "enabled" .Values.workers.knowledgeExtraction.enabled "component" "knowledge-extraction" "identity" .Values.workers.knowledgeExtraction.identity)
-}}
{{- range $workload := $workloads }}
{{- if and $workload.enabled $workload.identity.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "romeo.identityServiceAccountName" (dict "root" $ "identity" $workload.identity "component" $workload.component) }}
  labels:
    {{- include "romeo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $workload.component }}
  {{- with $workload.identity.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $workload.identity.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- $jobs := list
  (dict "enabled" .Values.migration.enabled "component" "migration" "serviceAccount" .Values.migration.serviceAccount)
  (dict "enabled" .Values.backup.enabled "component" "postgres-backup" "serviceAccount" .Values.backup.serviceAccount)
-}}
{{- range $job := $jobs }}
{{- if and $job.enabled $job.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "romeo.identityServiceAccountName" (dict "root" $ "identity" (dict "serviceAccount" $job.serviceAccount) "component" $job.component) }}
  labels:
    {{- include "romeo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $job.component }}
  {{- with $job.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $job.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
