  BILLING_ENABLED: "false"
  BILLING_STRIPE_WEBHOOK_TOLERANCE_SECONDS: "300"
  BILLING_GENERIC_WEBHOOK_TOLERANCE_SECONDS: "300"
  BILLING_WEBHOOK_ORG_ID: org_default
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_ENDPOINT_ALLOWED_ORIGINS: ""
  OIDC_FETCH_MAX_BYTES: "262144"
  OIDC_FETCH_TIMEOUT_MS: "10000"
  OIDC_CACHE_TTL_MS: "300000"
  OIDC_GROUP_CLAIM: groups
