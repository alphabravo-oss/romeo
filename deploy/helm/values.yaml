  FILE_MALWARE_SCAN_EXCEPTION_ENABLED: "false"
  FILE_MALWARE_SCAN_EXCEPTION_OWNER: ""
  FILE_MALWARE_SCAN_EXCEPTION_REASON: ""
  FILE_MALWARE_SCAN_EXCEPTION_EXPIRES_AT: ""
