migration:
  enabled: true
  useHelmHook: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 600
  annotations: {}
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

workers:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  webhookRetry:
    # Retired in production: the internal all-tenant coordinator owns retries.
    enabled: false
    schedule: "*/5 * * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  notificationRetry:
    # Retired in production: the internal all-tenant coordinator owns retries.
    enabled: false
    schedule: "*/5 * * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  retentionEnforce:
    # Retired in production: the internal all-tenant coordinator owns retention.
    enabled: false
    schedule: "17 2 * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  billingEntitlementReconcile:
    enabled: false
    schedule: "*/10 * * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  billingLifecycleEnforce:
    enabled: false
    schedule: "*/15 * * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  toolDispatch:
    enabled: false
    schedule: "*/1 * * * *"
    maxJobs: 10
    leaseSeconds: 300
    timeoutMs: 10000
    maxBytes: 1000000
    allowPrivateNetwork: false
    secretResolverDriver: disabled
    payloadSecret:
      name: ""
      key: payloads.json
    resolverCredentialSecret:
      name: ""
      key: token
    identity:
      audience: tool_dispatch
      scopes:
        - worker:tool_dispatch
      credentialSecret:
        name: ""
        key: token
      previousCredentialSecret:
        name: ""
        key: ""
      serviceAccount:
        create: true
        name: ""
        annotations: {}
        automountServiceAccountToken: false
    networkPolicy:
      enabled: false
      egress: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  browserAutomation:
    enabled: false
    schedule: "*/1 * * * *"
    runnerUrl: ""
    maxJobs: 5
    leaseSeconds: 300
    timeoutMs: 30000
    maxBytes: 20000
    identity:
      audience: browser_automation
      scopes:
        - worker:browser_automation
      credentialSecret:
        name: ""
        key: token
      previousCredentialSecret:
        name: ""
        key: ""
      serviceAccount:
        create: true
        name: ""
        annotations: {}
        automountServiceAccountToken: false
    networkPolicy:
      enabled: false
      egress: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  knowledgeExtraction:
    enabled: false
    schedule: "*/10 * * * *"
    knowledgeBaseId: ""
    maxSources: 10
    identity:
      audience: knowledge_extraction
      scopes:
        - worker:knowledge_extraction
      credentialSecret:
        name: ""
        key: token
      previousCredentialSecret:
        name: ""
        key: ""
      serviceAccount:
        create: true
        name: ""
        annotations: {}
        automountServiceAccountToken: false
    networkPolicy:
      enabled: false
      egress: []
    tmpSizeLimit: 1Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  voiceCatalogSync:
    # Retired in production: the internal all-tenant coordinator owns voice sync.
    enabled: false
    schedule: "0 */12 * * *"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

backup:
  # Use managed-verified for this chart's CronJob, or externally-managed when
  # the database platform owns backup scheduling, verification, and alerting.
  mode: externally-managed
  enabled: false
  externalManagement:
    # Render-only sentinels. A production release must replace both with the
    # accountable team and reviewed backup/restore evidence reference.
    owner: REQUIRED_DEPLOYMENT_OWNER
    evidenceReference: REQUIRED_REVIEWED_BACKUP_EVIDENCE_REFERENCE
    observedAt: "2026-08-23T00:00:00Z"
    statusReference: REQUIRED_LIVE_BACKUP_STATUS_REFERENCE
    alertsConfigured: true
  schedule: "17 3 * * *"
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  retentionDays: 30
  uploadTimeoutMs: 30000
  policyMaxAgeSeconds: 3600
  uploadUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_UPLOAD_URL
  manifestUploadUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_MANIFEST_UPLOAD_URL
  readbackUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_READBACK_URL
  manifestReadbackUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_MANIFEST_READBACK_URL
  statusUploadUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_STATUS_UPLOAD_URL
  statusReadbackUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_STATUS_READBACK_URL
  policyReadbackUrlSecret:
    name: ""
    key: POSTGRES_BACKUP_POLICY_READBACK_URL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Capabilities that are not shipped as in-chart workloads must have an
# accountable external owner, live status/readback evidence, and alerting.
essentialOperations:
  scheduledTenantWork:
    mode: internal
    maxEvidenceAgeSeconds: 900
    externalManagement:
      owner: ""
      evidenceReference: ""
      statusReference: ""
      alertsConfigured: false
      evidenceConfigMap:
        name: ""
        key: scheduled-operations.json
  objectStoreBackup:
    owner: REQUIRED_DEPLOYMENT_OWNER
    evidenceReference: REQUIRED_REVIEWED_OBJECT_BACKUP_EVIDENCE_REFERENCE
    observedAt: "2026-08-23T00:00:00Z"
    statusReference: REQUIRED_LIVE_OBJECT_BACKUP_STATUS_REFERENCE
    alertsConfigured: true
  disasterRecovery:
    owner: REQUIRED_DEPLOYMENT_OWNER
    evidenceReference: REQUIRED_REVIEWED_DR_EVIDENCE_REFERENCE
    observedAt: "2026-08-23T00:00:00Z"
    statusReference: REQUIRED_LIVE_DR_STATUS_REFERENCE
    alertsConfigured: true

networkPolicy:
  # Production rendering requires this default-deny policy and an explicit
  # deployment-specific egress allowlist (DNS, Postgres, Valkey, object store,
  # and enabled external providers as applicable).
  enabled: true
  # Render-only fail-closed sentinel aligned with EDGE_TRUSTED_PROXY_CIDRS.
  # Replace both with the exact ingress-controller/LB source boundary.
  ingressFrom:
    - ipBlock:
        cidr: 127.0.0.1/32
  # A reserved TEST-NET address keeps the default render fail-closed and
  # nonfunctional. Replace this with DNS, Postgres, Valkey, object-storage,
  # telemetry, scanner, and enabled-provider destinations before installing.
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 9
