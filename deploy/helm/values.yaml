  MODEL_CATALOG_SYNC_TTL_MS: "300000"
  MODEL_CATALOG_SYNC_TIMEOUT_MS: "10000"
  RUN_EXECUTION_LEASE_SECONDS: "60"
  RUN_RECOVERY_STALE_MS: "120000"
  MODEL_PROVIDER_RETRY_ATTEMPTS: "1"
  MODEL_PROVIDER_RETRY_BACKOFF_MS: "250"
  MODEL_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "5"
  MODEL_PROVIDER_CIRCUIT_COOLDOWN_MS: "60000"
  MODEL_PROVIDER_DISABLED_IDS: ""
  # Operator-only deployment kill switches; exact comma-separated IDs, with no spaces.
  CAPABILITY_PLATFORM_DISABLED_IDS: realtime_voice,external_provider_use,secure_compute,image_editing,multi_model_compare,streamed_output_policy
  MODEL_PROVIDER_FALLBACK_MODEL_ID: ""
  VALKEY_SECURITY_EXCEPTION_ENABLED: "false"
  VALKEY_SECURITY_EXCEPTION_SCOPE: ""
  VALKEY_SECURITY_EXCEPTION_OWNER: ""
  VALKEY_SECURITY_EXCEPTION_REASON: ""
  VALKEY_SECURITY_EXCEPTION_EXPIRES_AT: ""
  VALKEY_IN_CLUSTER_NETWORK_POLICY_ENABLED: "false"
  REALTIME_EVENT_DRIVER: valkey
  REALTIME_EVENT_KEY_PREFIX: romeo:chat-events:v1
  REALTIME_EVENT_TIMEOUT_MS: "2000"
  QUOTA_COORDINATION_DRIVER: valkey
  QUOTA_COORDINATION_KEY_PREFIX: romeo:quota:v1
  QUOTA_COORDINATION_TIMEOUT_MS: "2000"
  SCHEDULED_TENANT_WORK_OWNER: internal
  SCHEDULED_TENANT_WORK_EXTERNAL_EVIDENCE_PATH: ""
  SCHEDULED_TENANT_WORK_EXTERNAL_EVIDENCE_MAX_AGE_SECONDS: "900"
  EDGE_TLS_TERMINATION: ingress
  EDGE_TRUSTED_PROXY_MODE: trusted_proxy
  EDGE_TRUSTED_PROXY_HOPS: "1"
